<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Analytics layout preview</title><style>body{margin:16px;font:15px/1.5 Arial,sans-serif;color:#253c3e}select,button{font:inherit;min-height:44px;margin:0 12px 12px 0}iframe{display:block;border:1px solid #b9cccb;max-width:none}pre{white-space:pre-wrap}#canvas{overflow:auto}</style></head><body><h1>Analytics preferences layout review</h1><p>Tracking-free fixture using the hosted Photography page’s styles, footer and exact consent markup. Consent choices are inert. Frames test responsive CSS, not physical iPhone/Safari behavior.</p><label>Viewport <select id="size"><option value="320">320 px</option><option value="375">375 px</option><option value="390" selected>390 px</option><option value="430">430 px</option><option value="768">768 px</option><option value="1280">1280 px</option></select></label><button id="inspect">Inspect layout</button><pre id="result" aria-live="polite">Loading</pre><div id="canvas"><iframe id="review" title="Analytics consent responsive fixture" height="780" sandbox="allow-same-origin"></iframe></div><script>
const frame=document.querySelector('#review'),size=document.querySelector('#size'),result=document.querySelector('#result');
function inspect(){const d=frame.contentDocument,w=frame.contentWindow,p=d.querySelector('.gl-analytics-choice');if(!p)return;const buttons=[...d.querySelectorAll('.gl-analytics-actions button')];result.textContent=JSON.stringify({viewport:w.innerWidth,pageWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,panelWidth:Math.round(p.getBoundingClientRect().width),panelHeight:Math.round(p.getBoundingClientRect().height),preferencesBackground:w.getComputedStyle(d.querySelector('.gl-analytics-preferences')).backgroundColor,buttons:buttons.map(b=>({text:b.textContent,width:Math.round(b.getBoundingClientRect().width),height:Math.round(b.getBoundingClientRect().height),overflow:b.scrollWidth>b.clientWidth,textTransform:w.getComputedStyle(b).textTransform})),trackingScripts:d.scripts.length},null,2);}
(async()=>{if(!location.hostname.endsWith('.workers.dev')){result.textContent='This review fixture is available on hosted development previews only.';return;}
 const [html,script]=await Promise.all([fetch('/photography/').then(r=>r.text()),fetch('/analytics-consent.js').then(r=>r.text())]);
 const source=new DOMParser().parseFromString(html,'text/html'),fixture=document.implementation.createHTMLDocument('Consent layout fixture');
 fixture.head.innerHTML='<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">';
 for(const link of source.querySelectorAll('link[rel="stylesheet"]')){const copy=link.cloneNode();copy.href=new URL(link.getAttribute('href'),location.origin).href;fixture.head.append(copy);}
 fixture.body.className=source.body.className;
 const footer=source.querySelector('footer').cloneNode(true);fixture.body.append(footer);
 const button=fixture.createElement('button');button.className='gl-analytics-preferences';button.type='button';button.textContent='Analytics Preferences';
 const panel=fixture.createElement('section');panel.className='gl-analytics-choice';panel.setAttribute('aria-label','Analytics preferences');
 const match=script.match(/panel\.innerHTML='([^']*)';/);if(!match)throw Error('Consent markup changed; update fixture extraction.');panel.innerHTML=match[1];footer.append(button,panel);
 frame.onload=async()=>{await frame.contentDocument.fonts.ready;frame.contentWindow.scrollTo(0,frame.contentDocument.documentElement.scrollHeight);inspect();};frame.width=size.value;frame.srcdoc='<!doctype html>'+fixture.documentElement.outerHTML;
})().catch(e=>result.textContent=e.message);
size.onchange=()=>{frame.width=size.value;requestAnimationFrame(inspect);};document.querySelector('#inspect').onclick=inspect;
</script></body></html>
