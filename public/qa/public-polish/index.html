<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Public preview responsive review</title><style>body{margin:0;padding:16px;font:15px/1.5 system-ui;background:#edf8f8;color:#12383b}label,button,select{margin:0 8px 12px 0;font:inherit}button,select{min-height:44px}iframe{display:block;border:1px solid #78888a;background:white;max-width:none}#canvas{overflow:auto;max-width:100%}output{display:block;margin-bottom:12px}</style></head><body><h1>Public preview responsive review</h1><p>Hosted browser frames, not physical iPhone/Safari certification. No screenshots or private client data.</p><label>Viewport <select id="size"><option value="390,844">390 × 844</option><option value="430,932">430 × 932</option><option value="768,1024">768 × 1024</option><option value="1280,800">Desktop 1280 × 800</option></select></label><label>Page <select id="page"><option value="/portfolio-2/#love-in-a-minute">Love in a Minute</option><option value="/experience-2/#our-approach">Tenor Sans test</option><option value="/portfolio-2/#your-love-story">Love-story CTA</option><option value="/about-us/#gl-about-frank-name">About Frank</option><option value="/contact-us-2/">Contact</option><option value="/">Homepage</option></select></label><button id="inspect">Inspect layout</button><button id="swipe">Simulate short left swipe</button><button id="vertical">Simulate vertical gesture</button><output id="result" aria-live="polite"></output><div id="canvas"><iframe id="review" title="Hosted public page"></iframe></div><script>
const frame=document.querySelector('#review'),size=document.querySelector('#size'),page=document.querySelector('#page'),result=document.querySelector('#result');
function load(){const [width,height]=size.value.split(',');frame.width=width;frame.height=height;frame.src=page.value;result.textContent='Loading '+width+' × '+height;}
function inspect(){const d=frame.contentDocument,w=frame.contentWindow,bar=d.querySelector('.gl-mobile-cta'),headline=d.querySelector('.gl-tenor-test'),support=d.querySelector('.gl-film-closing p:not(.gl-film-closing-eyebrow)');result.textContent=JSON.stringify({viewport:[w.innerWidth,w.innerHeight],pageWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,contactBar:bar?w.getComputedStyle(bar).display:null,touchAction:d.querySelector('[data-short-stage]')?w.getComputedStyle(d.querySelector('[data-short-stage]')).touchAction:null,font:headline?w.getComputedStyle(headline).fontFamily:null,tenorLoaded:headline?w.document.fonts.check('32px "Tenor Sans"'):null,ctaSubline:support?w.getComputedStyle(support).color:null});}
function gesture(vertical){const d=frame.contentDocument,w=frame.contentWindow,stage=d.querySelector('[data-short-stage]');if(!stage){result.textContent='Open Love in a Minute first.';return;}const before=d.querySelector('.gl-short-picker').selectedIndex;for(const [type,x,y] of [['pointerdown',200,100],['pointermove',vertical?204:173,vertical?128:104],['pointerup',vertical?204:173,vertical?128:104]])stage.dispatchEvent(new w.PointerEvent(type,{bubbles:true,pointerId:1,pointerType:'touch',isPrimary:true,clientX:x,clientY:y}));stage.click();result.textContent=JSON.stringify({simulated:true,vertical,before,after:d.querySelector('.gl-short-picker').selectedIndex,accidentalPlayers:d.querySelectorAll('.gl-film-dialog[open]').length});}
size.onchange=load;page.onchange=load;frame.onload=inspect;document.querySelector('#inspect').onclick=inspect;document.querySelector('#swipe').onclick=()=>gesture(false);document.querySelector('#vertical').onclick=()=>gesture(true);load();
</script></body></html>
