<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Public preview responsive review</title><style>body{margin:0;padding:16px;font:15px/1.5 system-ui;background:#edf8f8;color:#12383b}label,button,select{margin:0 8px 12px 0;font:inherit}button,select{min-height:44px}iframe{display:block;border:1px solid #78888a;background:white;max-width:none}#canvas{overflow:auto;max-width:100%}output{display:block;margin-bottom:12px}</style></head><body><h1>Public preview responsive review</h1><p>Hosted browser frames, not physical iPhone/Safari certification. No screenshots or private client data.</p><label>Viewport <select id="size"><option value="390,844">390 × 844</option><option value="430,932">430 × 932</option><option value="768,1024">768 × 1024</option><option value="1024,768">1024 × 768</option><option value="1440,900">1440 × 900</option><option value="1280,800">Desktop 1280 × 800</option><option value="810,1080">810 × 1080</option><option value="820,1180">820 × 1180</option><option value="834,1194">834 × 1194</option><option value="1024,1366">1024 × 1366</option><option value="1080,810">1080 × 810</option><option value="1180,820">1180 × 820</option><option value="1194,834">1194 × 834</option><option value="1366,1024">1366 × 1024</option></select></label><label>Page <select id="page"><option value="/sweet-sixteen/#sweet-photography">Sweet Sixteen photography</option><option value="/sweet-sixteen/">Sweet Sixteen full page</option><option value="/portfolio/">Photography</option><option value="/photography/wedding-collection/">Wedding Collection</option><option value="/portfolio-2/#love-in-a-minute">Love in a Minute</option><option value="/experience-2/#our-approach">Tenor Sans test</option><option value="/portfolio-2/#your-love-story">Love-story CTA</option><option value="/about-us/#gl-about-frank-name">About Frank</option><option value="/client-reviews/#deanna-2022">Deanna review short</option><option value="/contact-us-2/">Contact</option><option value="/">Homepage</option></select></label><button id="matrix">Run footer and overflow audit</button><pre id="matrix-result" aria-live="polite"></pre><button id="inspect">Inspect layout</button><button id="swipe">Simulate short left swipe</button><button id="vertical">Simulate vertical gesture</button><output id="result" aria-live="polite"></output><div id="canvas"><iframe id="review" title="Hosted public page"></iframe></div><script>
const frame=document.querySelector('#review'),size=document.querySelector('#size'),page=document.querySelector('#page'),result=document.querySelector('#result');
function load(){const [width,height]=size.value.split(',');frame.width=width;frame.height=height;frame.src=page.value;result.textContent='Loading '+width+' × '+height;}
function inspect(){const d=frame.contentDocument,w=frame.contentWindow,bar=d.querySelector('.gl-mobile-cta'),headline=d.querySelector('.gl-tenor-test'),support=d.querySelector('.gl-film-closing p:not(.gl-film-closing-eyebrow)');result.textContent=JSON.stringify({viewport:[w.innerWidth,w.innerHeight],pageWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,contactBar:bar?w.getComputedStyle(bar).display:null,touchAction:d.querySelector('[data-short-stage]')?w.getComputedStyle(d.querySelector('[data-short-stage]')).touchAction:null,font:headline?w.getComputedStyle(headline).fontFamily:null,tenorLoaded:headline?w.document.fonts.check('32px "Tenor Sans"'):null,ctaSubline:support?w.getComputedStyle(support).color:null});}
function gesture(vertical){const d=frame.contentDocument,w=frame.contentWindow,stage=d.querySelector('[data-short-stage]');if(!stage){result.textContent='Open Love in a Minute first.';return;}const before=d.querySelector('.gl-short-picker').selectedIndex;for(const [type,x,y] of [['pointerdown',200,100],['pointermove',vertical?204:173,vertical?128:104],['pointerup',vertical?204:173,vertical?128:104]])stage.dispatchEvent(new w.PointerEvent(type,{bubbles:true,pointerId:1,pointerType:'touch',isPrimary:true,clientX:x,clientY:y}));stage.click();result.textContent=JSON.stringify({simulated:true,vertical,before,after:d.querySelector('.gl-short-picker').selectedIndex,accidentalPlayers:d.querySelectorAll('.gl-film-dialog[open]').length});}
document.querySelector('#matrix').onclick=async()=>{
 const output=document.querySelector('#matrix-result'),button=document.querySelector('#matrix');const controls=[...document.querySelectorAll('button,select')];controls.forEach(e=>e.disabled=true);const results=[];
 const paths=['/','/portfolio-2/','/portfolio/','/photography/wedding-collection/','/sweet-sixteen/','/experience-2/','/contact-us-2/','/about-us/','/client-reviews/'];
 const sizes=[[390,844],[430,932],[768,1024],[810,1080],[820,1180],[834,1194],[1024,1366],[1024,768],[1080,810],[1180,820],[1194,834],[1366,1024],[1440,900]];
 try{for(const path of paths)for(const [width,height] of sizes){
  frame.width=width;frame.height=height;await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('Frame load timeout')),20000);frame.onload=()=>{clearTimeout(timer);resolve();};frame.src=path;});
  const d=frame.contentDocument,w=frame.contentWindow;await d.fonts.ready;
  w.scrollTo(0,d.documentElement.scrollHeight);await new Promise(r=>setTimeout(r,250));
  const footer=d.querySelector('.gl-site-footer'),end=footer.getBoundingClientRect().bottom+w.scrollY;
  const bar=d.querySelector('.gl-mobile-cta'),allowance=bar&&w.getComputedStyle(bar).display!=='none'?bar.getBoundingClientRect().height:0;
  const gap=Math.round(d.documentElement.scrollHeight-end);
  results.push({path,width,height,gap,allowance:Math.round(allowance),overflow:d.documentElement.scrollWidth>w.innerWidth+1,pass:gap<=allowance+2&&gap>=-2&&d.documentElement.scrollWidth<=w.innerWidth+1});
  output.textContent=JSON.stringify({completed:results.length,total:paths.length*sizes.length,failures:results.filter(r=>!r.pass),results},null,2);
 }}catch(error){output.textContent+='\nERROR: '+error.message;}finally{controls.forEach(e=>e.disabled=false);frame.onload=inspect;}
};
size.onchange=load;page.onchange=load;frame.onload=inspect;document.querySelector('#inspect').onclick=inspect;document.querySelector('#swipe').onclick=()=>gesture(false);document.querySelector('#vertical').onclick=()=>gesture(true);load();
</script></body></html>
