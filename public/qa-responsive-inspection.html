<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temporary responsive inspection</title><style>body{margin:0;font:14px Arial;background:#ddd}form{padding:8px;display:flex;gap:12px;align-items:center}iframe{display:block;border:0;background:white;margin:auto}button,select{min-height:32px}</style></head><body><form><label>Page <select name="route"><option value="/">Home</option><option value="/sweet-sixteen/">Sweet Sixteen</option><option value="/portfolio-2/">Cinematography</option><option value="/portfolio/">Photography</option><option value="/client-reviews/">Reviews</option><option value="/experience-2/">Experience</option><option value="/about-us/">About Us</option><option value="/contact-us-2/">Contact</option></select></label><label>Viewport <select name="size"><option value="desktop">Desktop 1280 × 800</option><option value="landscape">Tablet landscape 1024 × 768</option><option value="portrait">Tablet portrait 768 × 1024</option><option value="mobile">Mobile portrait 390 × 844</option></select></label><button>Inspect layout</button></form><iframe title="Hosted responsive page" allow="autoplay; fullscreen" ></iframe><script>const q=new URLSearchParams(location.search),route=document.querySelector('[name=route]'),size=document.querySelector('[name=size]');if([...route.options].some(o=>o.value===q.get('route')))route.value=q.get('route');if([...size.options].some(o=>o.value===q.get('size')))size.value=q.get('size');const dimensions={desktop:[1280,800],landscape:[1024,768],portrait:[768,1024],mobile:[390,844]}[size.value],frame=document.querySelector('iframe');frame.width=dimensions[0];frame.height=dimensions[1];frame.src=route.value;</script></body></html>
