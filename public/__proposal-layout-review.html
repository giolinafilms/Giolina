<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Temporary DEMO layout review</title><style>body{margin:0;font:14px system-ui;background:#dce5e5}header{padding:8px}iframe{display:block;border:0;margin:0 auto;background:white}select{padding:8px}</style></head><body><header><label>Viewport <select id="size"><option value="390x844">390 × 844</option><option value="430x932">430 × 932</option><option value="768x1024">768 × 1024</option><option value="1024x768">1024 × 768</option><option value="1280x800">1280 × 800</option></select></label><label>Proposal <select id="proposal"><option value="5baebc95fe5860bfd06786b2498e17a490c024ed6d0f949d170ec3d596e8b753">Wedding photography DEMO</option><option value="70fdca796e736a484291ac1b9ca713beb13b7c966c5aba84d099016abddd6dc4">Sweet Sixteen DEMO</option></select></label><label>Area <select id="area"><option value=".hero">Hero</option><option value=".collections">Services</option><option value=".investment">Summary</option><option value=".gallery">Gallery</option></select></label></header><iframe title="DEMO proposal layout"></iframe><script>const f=document.querySelector('iframe'),size=document.querySelector('#size'),p=document.querySelector('#proposal'),area=document.querySelector('#area');function resize(){const [w,h]=size.value.split('x');f.width=w;f.height=h}function page(){f.src='/proposal/'+p.value}size.onchange=resize;p.onchange=page;area.onchange=()=>f.contentDocument.querySelector(area.value)?.scrollIntoView();resize();page();</script></body></html>
